# =====================================================================
# Site
# =====================================================================
title: "Alex Sampson"
author: "Alex Sampson"
description: "Alex Sampson is a PhD student in Applied and Computational Mathematics at Florida State University, researching shape analysis, geometric PDEs, and optimal transport."
url: "https://alex-sampson.github.io"
lang: "en"
encoding: "utf-8"
date_format: "%B %-d, %Y"
date_format_dotted: "%Y · %m · %d"

# Permalinks: posts at /notes/<slug>/
permalink: /notes/:slug/

# Defaults — set the post layout + section once
defaults:
  - scope: { path: "", type: "posts" }
    values:
      layout: post
      section: notes        # keeps the Notes nav item active on post pages

# =====================================================================
# Analytics
# =====================================================================
umami:
  website_id: "ff37b074-f0e9-472b-9c3c-b3c5193bd75c"
  script: "https://cloud.umami.is/script.js"

# =====================================================================
# CV
# =====================================================================
cv:
  pdf: "/assets/pdf-documents/cv-updates/AlexSampson-CV.pdf"
  pages: 2
  updated: "May 2026"

# =====================================================================
# Plugins
# =====================================================================
plugins:
  - jekyll-feed
  - jekyll-sitemap

# =====================================================================
# Build
# =====================================================================
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules

sass:
  style: compressed
