<meta charset="{{ site.encoding | default: 'utf-8' }}">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.url != '/' %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
<meta name="description" content="{{ page.description | default: site.description | escape }}">
<meta name="author" content="{{ page.author | default: site.author | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">

<meta property="og:title" content="{{ page.title | default: site.title | escape }}">
<meta property="og:description" content="{{ page.description | default: site.description | escape }}">
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ page.image | default: '/assets/images/profile.png' | absolute_url }}">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page.title | default: site.title | escape }}">
<meta name="twitter:description" content="{{ page.description | default: site.description | escape }}">
<meta name="twitter:image" content="{{ page.image | default: '/assets/images/profile.png' | absolute_url }}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,500;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

{% if page.katex %}<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous">{% endif %}

<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">

{% if site.umami.website_id %}
<script defer src="{{ site.umami.script }}" data-website-id="{{ site.umami.website_id }}"></script>
{% endif %}

{% feed_meta %}

{% if page.url == '/' %}{% include jsonld-person.html %}{% endif %}
